<div class="card-wrapper w-full"> <article class="card-thumb-motion yuki-scroll-reveal card overflow-hidden h-full post-{{ include.p.wp_id }} post type-post status-publish format-standard has-post-thumbnail hentry{% for c in include.p.categories %} category-{{ c | slugify }}{% endfor %}{% for t in include.p.tags %} tag-{{ t | slugify }}{% endfor %}" data-card-layout="archive-grid" id="post-{{ include.p.wp_id }}">
{% if include.p.image %}<a aria-label="{{ include.p.title | escape }}" class="card-thumbnail entry-thumbnail last:mb-0" href="{{ include.p.url | relative_url }}"> <img alt="" class="w-full h-full wp-post-image" decoding="async" {% if include.first %}fetchpriority="high"{% else %}loading="lazy"{% endif %} src="{{ include.p.image | relative_url }}"> </a>{% endif %}
<div class="card-content"> <div class="entry-categories cat-taxonomies break-words mb-2 last:mb-0" data-tax-type="default">{% for c in include.p.categories %}{% assign c_slug = c | slugify %}<a class="entry-tax-item mr-2 last:mr-0" href="{{ '/category/' | append: c_slug | append: '/' | relative_url }}" rel="category tag">{{ c }}</a>{% endfor %}</div>
<h2 class="entry-title mb-half-gutter last:mb-0"><a class="link" href="{{ include.p.url | relative_url }}" rel="bookmark">{{ include.p.title }}</a> </h2>
<div class="entry-excerpt yuki-raw-html mb-gutter last:mb-0"> {{ include.p.excerpt | strip_html | strip }} </div>
<div class="entry-divider"></div>
{% include wp/meta.html p=include.p %}
</div></article> </div>
