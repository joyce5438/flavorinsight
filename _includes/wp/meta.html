{% assign content_size = include.p.content | strip_html | size %}
{% assign est_mins = content_size | divided_by: 350 | at_least: 2 %}
<div class="entry-metas mb-half-gutter last:mb-0">
  <span class="byline meta-item">
    <i class="fas fa-feather-pointed text-xs"></i>
    <a class="entry-meta-link hover:text-primary transition-colors" href="{{ '/author/joycewu703gmail-com/' | relative_url }}">{{ include.p.author | default: 'Austin' }}</a>
  </span>
  <span class="meta-item posted-on">
    <i class="far fa-calendar text-xs"></i>
    <a class="entry-meta-link" href="{{ include.p.url | relative_url }}" rel="bookmark">
      <time class="published" datetime="{{ include.p.date | date_to_xmlschema }}">{{ include.p.date | date: "%Y 年 %-m 月 %-d 日" }}</time>
    </a>
  </span>
  <span class="meta-item reading-time">
    <i class="far fa-clock text-xs"></i>
    <span>約 {{ est_mins }} 分鐘閱讀</span>
  </span>
</div>
