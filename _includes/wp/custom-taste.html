<style id="custom-taste-styles">
/* ==========================================================================
   TASTE & IMPECCABLE DESIGN SYSTEM ENHANCEMENTS
   風味洞察 (From Flavor to Insight)
   ========================================================================== */

/* 1. Typography & Smoothing */
body, .yuki-body, .yuki-article-content, .card .entry-title, .site-title, .site-tagline {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Hiragino Sans GB", "Noto Sans TC", "Microsoft JhengHei", sans-serif !important;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

html {
  scroll-behavior: smooth;
}

[id] {
  scroll-margin-top: 90px;
}

/* 2. Reading Progress Bar */
#reading-progress-bar {
  position: fixed;
  top: 0;
  left: 0;
  height: 3px;
  width: 0%;
  background: var(--yuki-primary-color, #c4403b);
  z-index: 999999;
  transition: width 0.08s ease-out;
}

/* 3. Desktop Horizontal Navigation */
.taste-desktop-nav {
  display: none;
}
@media (min-width: 992px) {
  .taste-desktop-nav {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    height: 100%;
  }
  .taste-nav-item {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--yuki-accent-color);
    padding: 0.35rem 0.5rem;
    border-radius: 4px;
    transition: color 0.2s ease, background-color 0.2s ease;
    text-decoration: none;
  }
  .taste-nav-item:hover {
    color: var(--yuki-primary-color);
    background-color: rgba(196, 64, 59, 0.06);
    text-decoration: none;
  }
}

/* 4. Breadcrumb Navigation */
.taste-breadcrumbs {
  font-size: 0.85rem;
  color: var(--yuki-accent-color);
  opacity: 0.8;
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 0.5rem;
}
.taste-breadcrumbs a {
  color: var(--yuki-accent-color);
  transition: color 0.2s ease;
  text-decoration: none;
}
.taste-breadcrumbs a:hover {
  color: var(--yuki-primary-color);
  text-decoration: none;
}
.taste-breadcrumbs .separator {
  opacity: 0.4;
  font-size: 0.75rem;
}
.taste-breadcrumbs .current {
  color: var(--yuki-headings-color);
  font-weight: 500;
}

/* 5. Featured Lead Story Card on Archive / Home */
.card-wrapper-featured {
  width: 100% !important;
  max-width: 100% !important;
  margin-bottom: 2.25rem !important;
}

.card-wrapper-featured .card {
  border-radius: 14px !important;
  overflow: hidden;
  border: 1px solid var(--yuki-base-200);
  background: var(--yuki-base-color);
  box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.07);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease;
}

.card-wrapper-featured .card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 36px -8px rgba(0, 0, 0, 0.13);
  border-color: rgba(196, 64, 59, 0.35);
}

@media (min-width: 768px) {
  .card-wrapper-featured .featured-inner {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .card-wrapper-featured .featured-thumb-wrap {
    width: 52%;
    flex-shrink: 0;
    min-height: 380px;
  }
  .card-wrapper-featured .featured-content-wrap {
    width: 48%;
    padding: 2.5rem 2.25rem !important;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
}

.featured-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 12px;
  background: rgba(196, 64, 59, 0.08);
  color: var(--yuki-primary-color);
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  width: fit-content;
  margin-bottom: 0.85rem;
}

.featured-content-wrap .entry-title {
  font-size: 1.75rem !important;
  line-height: 1.35 !important;
  margin-bottom: 0.85rem !important;
}

.featured-content-wrap .entry-excerpt {
  font-size: 1.02rem !important;
  line-height: 1.75 !important;
  color: var(--yuki-accent-color) !important;
  opacity: 0.9;
  margin-bottom: 1.25rem !important;
}

/* 6. Standard Card Craft */
.card-wrapper:not(.card-wrapper-featured) .card {
  border-radius: 12px !important;
  overflow: hidden;
  border: 1px solid var(--yuki-base-200);
  background: var(--yuki-base-color);
  box-shadow: 0 4px 14px -2px rgba(0, 0, 0, 0.05);
  transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease;
  display: flex;
  flex-direction: column;
}

.card-wrapper:not(.card-wrapper-featured) .card:hover {
  transform: translateY(-4px);
  box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.12);
  border-color: rgba(196, 64, 59, 0.3);
}

.card .entry-thumbnail {
  overflow: hidden;
  position: relative;
  height: 220px !important;
}

.card .entry-thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.card:hover .entry-thumbnail img {
  transform: scale(1.05);
}

.card .entry-categories a {
  display: inline-block;
  padding: 2px 10px;
  background: rgba(196, 64, 59, 0.08);
  color: var(--yuki-primary-color) !important;
  border-radius: 9999px;
  font-size: 0.72rem;
  font-weight: 600;
  text-decoration: none;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.card .entry-categories a:hover {
  background: var(--yuki-primary-color);
  color: #fff !important;
  text-decoration: none;
}

.card .entry-title a {
  transition: color 0.2s ease;
  text-decoration: none;
}

.card .entry-title a:hover {
  color: var(--yuki-primary-color) !important;
}

.card .entry-excerpt {
  color: var(--yuki-accent-color);
  opacity: 0.88;
  line-height: 1.65;
  font-size: 0.95rem;
}

/* Remove legacy dashed line */
.card .entry-divider {
  display: none !important;
}

/* Card Metas */
.card .entry-metas, .yuki-article-header .entry-metas {
  font-size: 0.8rem !important;
  color: var(--yuki-accent-color);
  opacity: 0.85;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
}

.entry-metas .meta-item {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
}

.entry-metas .meta-divider {
  display: none !important;
}

/* 7. Article Page Reading Measures & Typography */
.yuki-max-w-content, .yuki-article-content {
  max-width: 760px !important;
  margin-left: auto !important;
  margin-right: auto !important;
}

.yuki-article-content {
  font-size: 19px !important;
  line-height: 1.88 !important;
  color: var(--yuki-content-base-color);
}

.yuki-article-header {
  padding-bottom: 1.5rem !important;
  border-bottom: 1px solid var(--yuki-base-200);
  margin-bottom: 2rem !important;
}

.yuki-article-header .entry-title h1 {
  font-size: 2.2rem !important;
  font-weight: 700 !important;
  line-height: 1.35 !important;
  letter-spacing: -0.015em;
  margin-bottom: 1rem !important;
}

@media (max-width: 768px) {
  .yuki-article-header .entry-title h1 {
    font-size: 1.7rem !important;
  }
}

.yuki-article-content h2 {
  font-size: 1.65rem !important;
  font-weight: 700 !important;
  line-height: 1.4 !important;
  margin-top: 2.75rem !important;
  margin-bottom: 1rem !important;
  padding-bottom: 0.5rem !important;
  border-bottom: 1px solid var(--yuki-base-200) !important;
  color: var(--yuki-headings-color) !important;
}

.yuki-article-content h3 {
  font-size: 1.3rem !important;
  font-weight: 600 !important;
  line-height: 1.45 !important;
  margin-top: 2rem !important;
  margin-bottom: 0.75rem !important;
  color: var(--yuki-headings-color) !important;
}

.yuki-article-content p {
  margin-bottom: 1.6rem !important;
}

.yuki-article-content blockquote {
  border-left: 4px solid var(--yuki-primary-color) !important;
  background: rgba(196, 64, 59, 0.04) !important;
  padding: 1.1rem 1.5rem !important;
  border-radius: 0 8px 8px 0 !important;
  margin: 2rem 0 !important;
  font-style: normal !important;
  color: var(--yuki-accent-active) !important;
}

.yuki-article-content img {
  border-radius: 8px;
  box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.06);
}

.yuki-article-content figcaption, .yuki-article-content .wp-caption-text {
  font-size: 0.85rem !important;
  color: var(--yuki-accent-color) !important;
  opacity: 0.8 !important;
  text-align: center !important;
  margin-top: 0.5rem !important;
  font-style: italic !important;
}

/* 8. Modern Table of Contents */
#ez-toc-container, .ez-toc-container {
  background-color: var(--yuki-base-color) !important;
  border: 1px solid var(--yuki-base-200) !important;
  border-left: 4px solid var(--yuki-primary-color) !important;
  border-radius: 10px !important;
  padding: 1.25rem 1.5rem !important;
  margin: 2rem 0 !important;
  box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.04) !important;
}

#ez-toc-container .ez-toc-title, .ez-toc-title-container {
  font-weight: 700 !important;
  font-size: 1.05rem !important;
  color: var(--yuki-headings-color) !important;
  margin-bottom: 0.75rem !important;
}

#ez-toc-container ul li a {
  color: var(--yuki-accent-color) !important;
  transition: color 0.2s ease, transform 0.2s ease;
}

#ez-toc-container ul li a:hover {
  color: var(--yuki-primary-color) !important;
  text-decoration: none !important;
}

/* 9. Next / Previous Post Navigation */
.yuki-post-navigation {
  margin-top: 3rem !important;
  padding-top: 2rem !important;
  border-top: 1px solid var(--yuki-base-200) !important;
}

.yuki-post-navigation .nav-links {
  display: grid !important;
  grid-template-columns: 1fr 1fr;
  gap: 1.25rem;
}

@media (max-width: 640px) {
  .yuki-post-navigation .nav-links {
    grid-template-columns: 1fr !important;
  }
}

.yuki-post-navigation .nav-links a {
  display: flex !important;
  align-items: center;
  padding: 1rem 1.25rem !important;
  border-radius: 10px !important;
  border: 1px solid var(--yuki-base-200) !important;
  background: var(--yuki-base-color) !important;
  text-decoration: none !important;
  transition: all 0.25s ease !important;
  box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.04);
}

.yuki-post-navigation .nav-links a:hover {
  border-color: var(--yuki-primary-color) !important;
  transform: translateY(-2px);
  box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
  text-decoration: none !important;
}

.yuki-post-navigation .item-label {
  font-size: 0.75rem !important;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--yuki-primary-color) !important;
  font-weight: 600 !important;
  margin-bottom: 0.25rem;
  display: block;
}

.yuki-post-navigation .item-title {
  font-size: 0.95rem !important;
  font-weight: 600 !important;
  color: var(--yuki-headings-color) !important;
  line-height: 1.4 !important;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 10. Footer Refinements */
.taste-footer-wrap {
  padding: 2.5rem 0 2rem;
  border-top: 1px solid var(--yuki-base-200);
  background-color: var(--yuki-base-color);
}

.taste-footer-content {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 1.5rem;
}

.taste-footer-links {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1.25rem;
  font-size: 0.88rem;
}

.taste-footer-links a {
  color: var(--yuki-accent-color);
  transition: color 0.2s ease;
  text-decoration: none;
}

.taste-footer-links a:hover {
  color: var(--yuki-primary-color);
  text-decoration: none;
}

.taste-footer-copy {
  font-size: 0.85rem;
  color: var(--yuki-accent-color);
  opacity: 0.8;
}

/* 11. Dark Mode Specific Overrides */
html[data-yuki-theme="dark"] .featured-badge {
  background: rgba(196, 64, 59, 0.18) !important;
}

html[data-yuki-theme="dark"] .yuki-article-content blockquote {
  background: rgba(196, 64, 59, 0.08) !important;
}

html[data-yuki-theme="dark"] .card-wrapper-featured .card,
html[data-yuki-theme="dark"] .card-wrapper .card,
html[data-yuki-theme="dark"] #ez-toc-container,
html[data-yuki-theme="dark"] .yuki-post-navigation .nav-links a {
  box-shadow: 0 4px 16px -2px rgba(0, 0, 0, 0.3) !important;
  border-color: rgba(255, 255, 255, 0.08) !important;
}

html[data-yuki-theme="dark"] .card-wrapper-featured .card:hover,
html[data-yuki-theme="dark"] .card-wrapper .card:hover,
html[data-yuki-theme="dark"] .yuki-post-navigation .nav-links a:hover {
  box-shadow: 0 12px 28px -4px rgba(0, 0, 0, 0.45) !important;
  border-color: var(--yuki-primary-color) !important;
}

html[data-yuki-theme="dark"] .taste-nav-item:hover {
  background-color: rgba(196, 64, 59, 0.15);
}
</style>

<script>
// Reading Progress Bar calculation
(function() {
  function updateProgress() {
    var bar = document.getElementById('reading-progress-bar');
    if (!bar) return;
    var doc = document.documentElement;
    var total = doc.scrollHeight - doc.clientHeight;
    var current = window.scrollY || doc.scrollTop;
    var progress = total > 0 ? (current / total) * 100 : 0;
    bar.style.width = Math.min(100, Math.max(0, progress)) + '%';
  }
  window.addEventListener('scroll', updateProgress, { passive: true });
  window.addEventListener('resize', updateProgress, { passive: true });
  document.addEventListener('DOMContentLoaded', updateProgress);
})();
</script>
