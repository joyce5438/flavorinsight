---
layout: default
title: 首頁
---
<ul class="post-list">
{% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">
      {% if post.image %}<img src="{{ post.image | relative_url }}" alt="" loading="lazy">{% endif %}
      <div>
        <h2>{{ post.title }}</h2>
        <time>{{ post.date | date: "%Y-%m-%d" }}</time>
        <p>{{ post.excerpt | strip_html | truncate: 120 }}</p>
      </div>
    </a>
  </li>
{% endfor %}
</ul>
